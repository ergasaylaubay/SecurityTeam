server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${MESSENGER_KEYSTORE:./secrets/server.p12}
server.ssl.key-store-password=${MESSENGER_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tls
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/messenger}
spring.datasource.username=${DB_USER:messenger}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-request-size=128KB
messenger.keystore=${MESSENGER_KEYSTORE:./secrets/server.p12}
messenger.keystore-password=${MESSENGER_KEYSTORE_PASSWORD}
